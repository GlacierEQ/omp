schema_version: 2
power_mode: maximum
anti_limits:
  no_artificial_caps: true
  allow_parallel: true
  allow_batch: true
  fail_closed_promotion_only: true
  fail_open_progress: true
router:
  strategy: best_first_with_fallback
  coverage_gain_weight: 2.0
  churn_penalty: 0.5
  prefer_higher_context: true
  unverified_allowed: true
quality:
  threshold: 9.0
  require_independent_verification: true
  require_readback: true
  pitstop_not_wall: true
swarm:
  max_concurrent: 32
  delegation_enabled: true
  helix_orchestration: true
mcp:
  auto_discover: true
  dynamic_registration: true
  schema_lock: false
